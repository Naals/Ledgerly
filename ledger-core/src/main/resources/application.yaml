server:
  port: 8080

spring:
  application:
    name: ledger-core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${DB_USER:ledger}
    password: ${DB_PASSWORD:ledger}
  flyway:
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 15000
        request.timeout.ms: 5000
        max.block.ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

ledger:
  holds:
    expiry:
      enabled: true
      interval-ms: 30000
      batch-size: 100
  outbox:
    kafka:
      send-timeout: 10s
      topics:
        HoldStatusChanged: ledger.hold-status-changed.v1
    cleanup:
      enabled: true
      retention-days: 7
      cron: "0 17 3 * * *"
    relay:
      enabled: true
      poll-interval-ms: 1000
      batch-size: 100


logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"