services:
  postgres:
    image: postgres:16-alpine
    container_name: ledgerly-postgres
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports:
      - "5432:5432"
    volumes:
      - ledgerly-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-payments:
    image: postgres:16-alpine
    container_name: ledgerly-postgres-payments
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports:
      - "5433:5432"
    volumes:
      - ledgerly-payments-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    container_name: ledgerly-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  ledger-core:
    build:
      context: .
      args:
        MODULE: ledger-core
    container_name: ledgerly-ledger-core
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ledger
      DB_USER: ledger
      DB_PASSWORD: ledger
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      LEDGER_OUTBOX_PUBLISHER: kafka
    ports:
      - "8080:8080"

  payment-service:
    build:
      context: .
      args:
        MODULE: payment-service
    container_name: ledgerly-payment-service
    depends_on:
      postgres-payments:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ledger-core:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres-payments:5432/payments
      DB_USER: payments
      DB_PASSWORD: payments
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      PAYMENTS_LEDGER_BASE_URL: http://ledger-core:8080
    ports:
      - "8081:8081"

volumes:
  ledgerly-pgdata:
  ledgerly-payments-pgdata: