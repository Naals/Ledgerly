server:
  port: 8081

spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/payments}
    username: ${DB_USER:payments}
    password: ${DB_PASSWORD:payments}
  flyway:
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

payments:
  outbox:
    cleanup:
      enabled: true
      retention-days: 7
      cron: "0 17 3 * * *"
    kafka:
      hold-topic: ledger.hold-status-changed.v1
      send-timeout: 10s
      topics:
        PaymentStatusChanged: payments.payment-status-changed.v1
    publisher: log            # log | kafka
    relay:
      enabled: true
      poll-interval-ms: 1000
      batch-size: 100
  reconciliation:
    grace-seconds: 300       # leave the hold events five minutes to settle an ended authorization first
    enabled: true
    poll-interval-ms: 60000
    batch-size: 50
  authorization:
    ttl-seconds: 86400        # how long the ledger holds the money before an uncaptured authorization expires
  ledger:
    base-url: http://localhost:8080
    timeout-ms: 3000
  retry:
    enabled: true
    poll-interval-ms: 10000
    older-than-seconds: 30
    batch-size: 50
  kafka:
    enabled: true
    ledger-topic: ledger.transaction-posted.v1


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true