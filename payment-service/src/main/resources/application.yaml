server:
  port: 8081

spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/payments}
    username: ${DB_USER:payments}
    password: ${DB_PASSWORD:payments}
  flyway:
    locations: classpath:db/migration

payments:
  ledger:
    base-url: http://localhost:8080
    timeout-ms: 3000
  retry:
    enabled: true
    poll-interval-ms: 10000
    older-than-seconds: 30
    batch-size: 50


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true