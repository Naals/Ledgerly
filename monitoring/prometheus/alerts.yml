groups:
  - name: ledgerly-reliability
    rules:

      - alert: LedgerlyServiceDown
        expr: up{job=~"ledger-core|payment-service"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is unavailable"
          description: >
            Prometheus cannot scrape {{ $labels.instance }}.
            Check container status and application logs.

      - alert: LedgerOutboxDeliveryDelayed
        expr: ledger_outbox_oldest_pending_age_seconds > 60
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Ledger outbox is delayed"
          description: >
            The oldest unpublished ledger event has been
            waiting for more than 60 seconds.

      - alert: PaymentOutboxDeliveryDelayed
        expr: payments_outbox_oldest_pending_age_seconds > 60
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Payment outbox is delayed"
          description: >
            Payment events are not being delivered in time.
            Check the relay, Kafka and outbox retry errors.

      - alert: LedgerlyPaymentInconsistency
        expr: sum(increase(payments_events_inconsistent_total[5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: "Ledger and payment state disagree"
          description: >
            A hold or ledger transaction contradicts
            the payment's recorded status.
            Manual investigation is required.

      - alert: LedgerlyDeadLetterEvent
        expr: sum(increase(payments_events_dead_lettered_total[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Kafka event moved to dead-letter topic"
          description: >
            An event could not be processed successfully.
            Inspect the dead-letter topic and exception headers.

      - alert: LedgerlyReconciliationFallback
        expr: sum(increase(payments_reconciliation_settled_total[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Payment reconciliation fallback used"
          description: >
            Reconciliation settled a payment that was not
            updated through the normal hold-event path.

      # Every payment-service replica samples the same consumer group. Use max,
      # not sum, so additional replicas do not multiply the reported backlog.
      - alert: PaymentConsumerLagHigh
        expr: max by (group, topic) (payments_kafka_consumer_lag) > 100
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Payment consumer group is falling behind"
          description: "Group {{ $labels.group }} has more than 100 retained offsets pending on {{ $labels.topic }} for 2 minutes. Check consumer errors and Kafka availability; offset distance approximates backlog, not an exact event count."

      # Keep instance labels: a healthy replica must not hide another sampler's
      # startup, failure or stale sample. Unknown lag must never imply zero lag.
      - alert: PaymentConsumerLagMonitoringUnavailable
        expr: (payments_kafka_lag_sample_success == 0) or (payments_kafka_lag_sample_age_seconds > 60)
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Payment consumer lag sample is unavailable"
          description: "Lag sampling for group {{ $labels.group }} on {{ $labels.instance }} has failed, has not completed, or is older than 60 seconds. Treat backlog as unknown and check Kafka access and sampler logs."

      - alert: PaymentConsumerOffsetsInvalid
        expr: max by (group, topic) (payments_kafka_consumer_invalid_offsets) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Payment consumer committed offsets are invalid"
          description: "Group {{ $labels.group }} has committed offsets outside the retained range on {{ $labels.topic }}. Backlog is unknown; investigate retention, topic recreation and consumer offset resets."
