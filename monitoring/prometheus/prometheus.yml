global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ledger-core
    metrics_path: /actuator/prometheus
    scrape_timeout: 5s
    static_configs:
      - targets:
          - ledger-core:8082

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    scrape_timeout: 5s
    static_configs:
      - targets:
          - payment-service:8083

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090